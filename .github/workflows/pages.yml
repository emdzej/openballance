name: Pages

# Builds and deploys the VitePress site to GitHub Pages at https://openballance.emdzej.pl/ (the custom-domain
# CNAME ships in docs/public/CNAME).
#
# The browser player (docs/public/play/) needs openballance.wasm, so the module is built first (the same
# steps as the CI wasm job) and copied in by docs/scripts/copy-wasm.sh. Only the engine goes into the site:
# the game data always comes from the player's own copy of Ballance, in their browser.

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'src/**'
      - 'CMakeLists.txt'
      - 'tools/fetch-gasm-sdk.sh'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # lastUpdated timestamps

      - name: fetch wasi-sdk and the gasm C SDK
        run: tools/fetch-gasm-sdk.sh

      - name: build openballance.wasm
        run: |
          cmake -S . -B build-gasm -DOPENBALLANCE_PLATFORM=gasm -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE=.deps/gasm-c-sdk/cmake/gasm-toolchain.cmake -DWASI_SDK_PREFIX="$PWD/.deps/wasi-sdk"
          cmake --build build-gasm -j

      - name: copy openballance.wasm into the play page
        run: docs/scripts/copy-wasm.sh build-gasm/openballance.wasm

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: docs/pnpm-lock.yaml

      - name: install
        working-directory: docs
        run: pnpm install --frozen-lockfile

      - name: build VitePress site
        working-directory: docs
        run: |
          scripts/vendor-web.sh
          pnpm build
          test -f .vitepress/dist/play/openballance.wasm
          test -f .vitepress/dist/play/vendor/gasm/gasm-worker.js

      - uses: actions/configure-pages@v6

      - name: upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
